# Publica la imagen en GHCR (x86 y ARM) y la pone en marcha en la máquina.
#
# Es manual a propósito: se lanza desde la pestaña Actions cuando se quiere
# desplegar. Para que sea automático al llegar a main, añade `push` en `on`.
#
# Secretos del repositorio que necesita (Settings → Secrets → Actions):
#   DEPLOY_HOST      IP o dominio de la máquina
#   DEPLOY_USER      usuario SSH (en Oracle con Ubuntu: `ubuntu`)
#   DEPLOY_SSH_KEY   clave privada con acceso a esa máquina
#
# En la máquina, infra/.env tiene que llevar
#   APP_IMAGE=ghcr.io/<usuario>/<repositorio>:latest
# y, si el paquete de GHCR es privado, haber hecho `docker login ghcr.io` una vez.
name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  image:
    name: Publicar imagen
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Desplegar en la máquina
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Actualizar por SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" \
            'cd /opt/sanatorio && git pull --ff-only && infra/scripts/deploy.sh'
